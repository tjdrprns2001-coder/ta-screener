<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA Screener — Personal</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2d333b; --txt:#e6edf3; --dim:#8b949e;
          --up:#3fb950; --down:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; font-size:13px; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin:0; }
  header .meta { color:var(--dim); font-size:12px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=number] { background:var(--bg); border:1px solid var(--line);
    color:var(--txt); padding:6px 10px; border-radius:6px; font-size:13px; }
  button { background:#1f6feb; border:0; color:#fff; padding:6px 12px; border-radius:6px;
    cursor:pointer; font-size:13px; }
  button.ghost { background:var(--panel); border:1px solid var(--line); color:var(--txt); }
  main { padding:12px 18px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { background:var(--panel); position:sticky; top:0; cursor:pointer; user-select:none; }
  th:hover { color:#fff; }
  tbody tr:hover { background:#1c2128; }
  .sym { font-weight:600; }
  .pos { color:var(--up); } .neg { color:var(--down); }
  .pill { display:inline-block; min-width:52px; padding:2px 6px; border-radius:4px;
          font-weight:600; text-align:center; }
  footer { padding:14px 18px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  #status { padding:30px; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>TA Screener</h1>
  <span class="meta" id="meta">loading…</span>
  <div class="controls">
    <input type="text" id="q" placeholder="심볼 검색 (예: BTC)">
    <input type="number" id="minMtf" placeholder="MTF ≥" style="width:80px">
    <button class="ghost" id="topBtn">상위 50</button>
    <button class="ghost" id="botBtn">하위 50</button>
    <button class="ghost" id="resetBtn">초기화</button>
  </div>
</header>
<main>
  <div id="status">데이터 로딩 중…</div>
  <table id="tbl" style="display:none">
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</main>
<footer>
  점수는 참고용 스크리닝 점수이며 매매 권유가 아닙니다. 데이터: Binance 공개 API, 15분마다 갱신.
  Scores are screening references only, not trading advice.
</footer>
<script>
const TFS = ["15m","1h","4h","1d","3d","1w"];
let ROWS = [], sortKey = "mtf", sortDir = -1, viewMode = "all";

function pill(v) {
  const a = Math.min(Math.abs(v) / 100, 1);
  const bg = v >= 0 ? `rgba(63,185,80,${0.12 + 0.5*a})` : `rgba(248,81,73,${0.12 + 0.5*a})`;
  return `<span class="pill" style="background:${bg}">${v.toFixed(0)}</span>`;
}
function fmtP(p) {
  if (p == null) return "-";
  return p >= 1000 ? p.toLocaleString("en-US",{maximumFractionDigits:1})
                   : p >= 1 ? p.toFixed(3) : p.toPrecision(3);
}

function render() {
  const q = document.getElementById("q").value.trim().toUpperCase();
  const minMtf = parseFloat(document.getElementById("minMtf").value);
  let rows = ROWS.filter(r =>
    (!q || r.s.includes(q)) &&
    (isNaN(minMtf) || r.mtf >= minMtf));
  rows.sort((a,b) => (a[sortKey] > b[sortKey] ? 1 : -1) * sortDir);
  if (viewMode === "top") rows = rows.slice(0, 50);
  if (viewMode === "bot") rows = rows.slice(-50).reverse();

  const head = document.getElementById("head");
  head.innerHTML = ["#","심볼","가격","24h%","15m","1h","4h","1d","3d","1w","MTF"]
    .map((h,i) => `<th data-k="${["i","s","p","c24",...TFS,"mtf"][i]}">${h}${["i","s","p","c24",...TFS,"mtf"][i]===sortKey?(sortDir<0?" ▼":" ▲"):""}</th>`).join("");
  head.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    render();
  });

  document.getElementById("body").innerHTML = rows.map((r,i) =>
    `<tr><td>${i+1}</td><td class="sym">${r.s}</td><td>${fmtP(r.p)}</td>` +
    `<td class="${r.c24>=0?"pos":"neg"}">${r.c24>=0?"+":""}${r.c24.toFixed(2)}%</td>` +
    TFS.map(tf => `<td>${pill(r.tf[tf].score)}</td>`).join("") +
    `<td>${pill(r.mtf)}</td></tr>`).join("");
  document.getElementById("tbl").style.display = "";
  document.getElementById("status").style.display = "none";
}

fetch("data/screener.json", {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => {
    ROWS = d.symbols.map((x,i) => ({...x, i}));
    const dt = new Date(d.generated_at);
    document.getElementById("meta").textContent =
      `${d.symbol_count} symbols · 스캔: ${dt.toLocaleString("ko-KR")} · ${d.scan_duration_sec}s`;
    render();
  })
  .catch(e => {
    document.getElementById("status").textContent =
      "스캔 데이터가 아직 없습니다. GitHub Actions 첫 실행 후 다시 확인하세요. (" + e.message + ")";
  });

document.getElementById("q").oninput = () => render();
document.getElementById("minMtf").oninput = () => render();
document.getElementById("topBtn").onclick = () => { viewMode="top"; render(); };
document.getElementById("botBtn").onclick = () => { viewMode="bot"; render(); };
document.getElementById("resetBtn").onclick = () => {
  document.getElementById("q").value = ""; document.getElementById("minMtf").value = "";
  viewMode = "all"; sortKey = "mtf"; sortDir = -1; render();
};
</script>
</body>
</html>
